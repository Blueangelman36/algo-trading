; asof: the numbers these docs state, and where each one comes from.
; https://github.com/Blueangelman36/asof
;
; Claims with `run` are re-checked on every push (.github/workflows/ci.yml).
; Claims with `every` are facts no command can answer; a weekly job
; (.github/workflows/stale-claims.yml) opens an issue when one is overdue.

[asof]
; An older copy of the whole project lives here locally and is not in git.
exclude = algo-trading/*

; ---- Settled by the code ------------------------------------------------

[status-refresh-seconds]
run = python tools/claims.py status-refresh-seconds
why = How often the Bots page re-polls bot status (bots.html setInterval).

[log-refresh-seconds]
run = python tools/claims.py log-refresh-seconds
why = How often the Logs page re-fetches the journal (logs.html setInterval).

[research-job-cap-minutes]
run = python tools/claims.py research-job-cap-minutes
why = Hard timeout on a dashboard research job (webapp/app.py _run_job). The
      troubleshooting sections tell people a job stuck past this has died.

[journal-lines]
run = python tools/claims.py journal-lines
why = The dashboard's journalctl call must match the pinned rule in
      deploy/sudoers-trading exactly, or sudo -n refuses it and the Logs page
      goes blank. The command reads the sudoers side.

[dashboard-port]
run = python tools/claims.py dashboard-port
why = The port gunicorn binds in deploy/dashboard.service. The docs' SSH
      tunnel and browse-to lines, and app.py's local default, must agree.

[python-version]
type = version
why = The Python the setup guide tells people to install, and the one CI
      tests with. If the guide moves on, CI should move with it.

[ibkr-paper-tws-port]
every = 365d
why = IBKR's default API port for paper TWS, from IBKR's API settings. Also
      the default of run_paper.py --ib-port.

[ibkr-paper-gateway-port]
every = 365d
why = IBKR's default API port for paper IB Gateway, from IBKR's API settings.

; ---- Settled by a person ------------------------------------------------

[holiday-lists-last]
every = 365d
why = Both holiday lists in research/event_calendar.py (federal, for the EIA
      report day; NYSE, for the first session after an OPEC meeting) end here.
      Extend both from opm.gov and nyse.com before then: past it they
      silently assume there are no holidays.

[opec-last]
every = 30d
why = The last hardcoded OPEC meeting in research/event_calendar.py. After it,
      the event-blackout filter covers no OPEC meeting at all. OPEC announces
      its monthly meetings one at a time, so re-check opec.org monthly: add
      what was announced, then update the guide's date (or `asof touch`).

[do-droplet-smallest]
every = 180d
why = DigitalOcean's cheapest Basic Droplet, per month. From their pricing page.

[do-droplet-recommended]
every = 180d
why = Price of the 1 GB Basic Droplet CLOUD_DEPLOYMENT.md recommends.

[do-free-credit]
every = 180d
why = DigitalOcean's new-account credit. Promotions change without notice.

[do-free-credit-days]
every = 180d
why = How long that new-account credit lasts.

[cl-contract-notional]
every = 90d
why = Rough dollar value of one CL contract (1,000 barrels x the crude price).
      Moves with oil; re-check against the front-month price.
